services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: idp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d idp"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10.1
    ports:
      - 6379:6379
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrations:
    build:
      context: .
      dockerfile: Dockerfile.migrations
    image: idp-migrations
    environment:
      DB_CONN_STR: postgresql://postgres:postgres@postgres:5432/idp
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  idp:
    build: .
    image: idp
    environment:
      ENV: local
      SERVICE_NAME: "IdP Service"
      DB_CONN_STR: postgresql://postgres:postgres@postgres:5432/idp
      REDIS_CONN_STR: redis://redis:6379/0
    ports:
      - 50050:50050
      - 50051:50051
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
